<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-labelledby="t d">
  <title id="t">ALIGN Pay architecture</title>
  <desc id="d">A customer chats with a Gemini support agent. Its money-moving tool calls go through the ALIGN Pay guard, which reads facts from PayPal and enforces limits a person confirmed from ALIGN decisions. Allowed actions execute through ALIGN Pay's own PayPal client; held ones wait for the owner; webhooks and Transaction Search feed the audit.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a4038"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b4532f"/>
    </marker>
    <style>
      .h { font: 600 19px Fraunces, Georgia, serif; fill: #1f1a16; }
      .s { font: 13.5px "DM Sans", Helvetica, Arial, sans-serif; fill: #4a4038; }
      .m { font: 12.5px "JetBrains Mono", Menlo, monospace; fill: #4a4038; }
      .l { font: 12.5px "DM Sans", Helvetica, Arial, sans-serif; fill: #7b6e62; }
      .lt { font: 600 12.5px "DM Sans", Helvetica, Arial, sans-serif; fill: #8e3f22; }
      .box { fill: #fffaf1; stroke: #cdbca3; stroke-width: 1.5; }
      .ln { stroke: #4a4038; stroke-width: 1.6; fill: none; }
      .lnt { stroke: #b4532f; stroke-width: 2.2; fill: none; }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>
  <rect width="1200" height="740" rx="18" fill="#f6efe3"/>

  <!-- top row -->
  <rect class="box" x="36" y="86" width="150" height="74" rx="10"/>
  <text class="h" x="58" y="118">Customer</text>
  <text class="s" x="58" y="140">chats with support</text>

  <rect class="box" x="246" y="70" width="250" height="106" rx="10"/>
  <text class="h" x="266" y="101">Support agent</text>
  <text class="s" x="266" y="124">Gemini Pro through the AI SDK</text>
  <text class="s" x="266" y="144">PayPal Agent Toolkit tool definitions</text>
  <text class="s" x="266" y="163">+ ALIGN Pay's refund_order</text>

  <rect x="566" y="44" width="300" height="168" rx="12" fill="#fffaf1" stroke="#b4532f" stroke-width="3"/>
  <text class="h" x="588" y="78" style="font-size:22px">ALIGN Pay guard</text>
  <text class="s" x="588" y="103">deterministic rules on PayPal's facts</text>
  <text class="m" x="588" y="132">allowed · held · blocked</text>
  <text class="s" x="588" y="157">block beats hold beats allow</text>
  <text class="s" x="588" y="177">missing facts, no decision, unknown tool</text>
  <text class="s" x="588" y="196">→ held, never allowed</text>

  <rect class="box" x="956" y="44" width="208" height="318" rx="12"/>
  <text class="h" x="976" y="78">PayPal sandbox</text>
  <text class="s" x="976" y="104">REST, api-m.sandbox</text>
  <text class="m" x="976" y="136">Orders v2</text>
  <text class="m" x="976" y="160">Payments v2 · refunds</text>
  <text class="m" x="976" y="184">Invoicing v2</text>
  <text class="m" x="976" y="208">Disputes v1</text>
  <text class="m" x="976" y="232">Transaction Search</text>
  <text class="m" x="976" y="256">Webhooks v1</text>
  <text class="m" x="976" y="280">JavaScript SDK v5</text>
  <text class="l" x="976" y="314">test card: orders capture</text>
  <text class="l" x="976" y="332">in one call, no buyer click</text>

  <!-- top row arrows -->
  <path class="ln" d="M186 123 L 242 123" marker-end="url(#a)"/>
  <path class="lnt" d="M496 108 L 562 108" marker-end="url(#at)"/>
  <text class="lt" x="499" y="98">tool calls</text>
  <path class="ln dash" d="M562 150 L 500 150" marker-end="url(#a)"/>
  <text class="l" x="500" y="168">result + key</text>

  <path class="ln" d="M952 86 L 870 86" marker-end="url(#a)"/>
  <text class="l" x="878" y="76">facts</text>
  <path class="lnt" d="M866 176 L 952 176" marker-end="url(#at)"/>
  <text class="lt" x="874" y="168">allowed</text>
  <text class="l" x="874" y="196">own client,</text>
  <text class="l" x="874" y="212">Request-Id,</text>
  <text class="l" x="874" y="228">decision key</text>

  <!-- middle row -->
  <rect class="box" x="36" y="300" width="230" height="122" rx="10"/>
  <text class="h" x="56" y="332">ALIGN ledger</text>
  <text class="s" x="56" y="356">decisions with exact-quote</text>
  <text class="s" x="56" y="374">receipts, confirmed by people</text>
  <text class="m" x="56" y="400">align mcp (read tools)</text>

  <rect class="box" x="316" y="300" width="270" height="122" rx="10"/>
  <text class="h" x="336" y="332">Policies</text>
  <text class="s" x="336" y="356">Gemini Pro drafts structured limits</text>
  <text class="s" x="336" y="375">a person confirms them</text>
  <text class="s" x="336" y="394">only confirmed limits are enforced</text>

  <rect class="box" x="636" y="300" width="230" height="122" rx="10"/>
  <text class="h" x="656" y="332">Holds and actions</text>
  <text class="s" x="656" y="356">every action, verdict, approver</text>
  <text class="s" x="656" y="375">and PayPal id</text>
  <text class="m" x="656" y="400">SQLite (node:sqlite)</text>

  <path class="ln" d="M266 361 L 312 361" marker-end="url(#a)"/>
  <path class="lnt" d="M520 300 L 640 216" marker-end="url(#at)"/>
  <text class="lt" x="520" y="250">confirmed limits</text>
  <path class="ln" d="M716 212 L 716 296" marker-end="url(#a)"/>
  <text class="l" x="724" y="262">holds</text>

  <!-- bottom row -->
  <rect class="box" x="316" y="470" width="270" height="96" rx="10"/>
  <text class="h" x="336" y="502">Owner page</text>
  <text class="s" x="336" y="526">approve or decline holds (facts re-checked)</text>
  <text class="s" x="336" y="545">edit numbers, confirm limits</text>
  <path class="ln" d="M451 466 L 451 426" marker-end="url(#a)"/>
  <path class="ln" d="M586 500 L 700 426" marker-end="url(#a)"/>
  <text class="l" x="606" y="456">approve</text>

  <rect class="box" x="636" y="470" width="230" height="96" rx="10"/>
  <text class="h" x="656" y="502">/api/paypal/webhook</text>
  <text class="s" x="656" y="526">signature verified with PayPal</text>
  <text class="s" x="656" y="545">reconciled once per event</text>
  <path class="ln" d="M751 466 L 751 426" marker-end="url(#a)"/>

  <rect class="box" x="986" y="470" width="178" height="62" rx="10"/>
  <text class="h" x="1004" y="497" style="font-size:16px">cloudflared tunnel</text>
  <text class="l" x="1004" y="518">quick tunnel to localhost</text>
  <path class="ln" d="M1075 366 L 1075 466" marker-end="url(#a)"/>
  <text class="l" x="1083" y="420">webhooks</text>
  <path class="ln" d="M982 501 L 870 516" marker-end="url(#a)"/>

  <rect x="636" y="616" width="230" height="92" rx="10" fill="#fffaf1" stroke="#a3342b" stroke-width="2"/>
  <text class="h" x="656" y="648">Audit</text>
  <text class="s" x="656" y="671">traced · incoming · untraced</text>
  <text class="s" x="656" y="690">every refund and invoice → a decision</text>
  <path class="ln" d="M751 570 L 751 612" marker-end="url(#a)"/>
  <path class="ln" d="M966 366 L 966 662 L 870 662" marker-end="url(#a)"/>
  <text class="l" x="884" y="652">Transaction Search</text>

  <rect x="36" y="470" width="230" height="96" rx="10" fill="#fffaf1" stroke="#cdbca3" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="h" x="56" y="502" style="font-size:16px">Code guard (optional)</text>
  <text class="s" x="56" y="526">a PR raising the refund limit</text>
  <text class="s" x="56" y="545">is flagged by ALIGN's PR check</text>
  <path class="ln dash" d="M151 426 L 151 466" marker-end="url(#a)"/>

  <text x="36" y="634" style="font: italic 600 20px Fraunces, Georgia, serif; fill:#1f1a16">The model proposes, a person confirms,</text>
  <text x="36" y="662" style="font: italic 600 20px Fraunces, Georgia, serif; fill:#1f1a16">plain code enforces.</text>
  <text class="l" x="36" y="690">Fictional store · PayPal sandbox · no real money</text>
</svg>
